<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>CALIBRE T-65 · 陀飞轮机芯拆解视图</title>
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<style>
  :root{
    --bg:#06070a; --panel:rgba(15,17,21,.80); --line:rgba(255,255,255,.085);
    --txt:#e9ebf0; --dim:#7d8492; --dim2:#565d6a; --accent:#3a5fce; --accent2:#6c8cff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  canvas#c{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas#c:active{cursor:grabbing}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);
    box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.045)}

  /* ---------- 品牌 ---------- */
  #brand{position:fixed;left:26px;top:22px;pointer-events:none;z-index:5}
  #brand .k{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:13px;letter-spacing:.36em;color:#f2f4f8}
  #brand .s{margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:.07em}
  #brand .s i{display:inline-block;width:14px;height:1px;background:var(--accent);vertical-align:middle;margin-right:8px}

  /* ---------- 工具条 ---------- */
  #tools{position:fixed;right:20px;top:20px;display:flex;gap:6px;flex-wrap:wrap;
    justify-content:flex-end;max-width:60vw;z-index:6}
  .btn{font-size:11.5px;letter-spacing:.05em;padding:7px 11px;border-radius:9px;
    border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);color:#c7ccd6;
    cursor:pointer;transition:.16s ease;white-space:nowrap;font-family:inherit;
    backdrop-filter:blur(12px)}
  .btn:hover{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.22)}
  .btn.on{background:var(--accent);border-color:#5b7ce8;color:#fff;box-shadow:0 0 0 3px rgba(58,95,206,.16)}
  .btn .n{opacity:.4;font-family:ui-monospace,monospace;font-size:9px;margin-left:5px;letter-spacing:0}
  .btn.on .n{opacity:.7}
  .btn.pulse{animation:pulseBtn 1.8s ease-in-out infinite}
  @keyframes pulseBtn{
    0%,100%{box-shadow:0 0 0 0 rgba(58,95,206,.5);border-color:rgba(108,140,255,.4);color:#dfe6ff}
    50%{box-shadow:0 0 0 6px rgba(58,95,206,0);border-color:rgba(108,140,255,.9);color:#fff}
  }

  /* ---------- 爆炸滑杆 ---------- */
  #left{position:fixed;left:26px;bottom:26px;width:246px;padding:14px 16px 12px;z-index:5}
  #left .lbl{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin-bottom:11px}
  #left .lbl b{font-family:ui-monospace,monospace;font-size:13px;color:var(--txt);letter-spacing:.02em}
  input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:rgba(255,255,255,.16);
    border-radius:2px;outline:none;cursor:pointer;display:block}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);box-shadow:0 0 10px rgba(58,95,206,.7);cursor:grab}
  #left .row{display:flex;gap:4px;margin-top:13px}
  #left .row .btn{flex:1;text-align:center;padding:6px 0;font-size:10.5px}

  /* ---------- 信息卡 ---------- */
  #card{position:fixed;right:20px;top:88px;width:296px;padding:18px 20px 17px;z-index:6;
    opacity:0;transform:translateX(14px);pointer-events:none;transition:.28s cubic-bezier(.2,.7,.3,1)}
  #card.show{opacity:1;transform:none;pointer-events:auto}
  #card .sys{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.2em;color:var(--accent2)}
  #card h2{font-size:19px;font-weight:600;letter-spacing:.02em;margin:8px 0 2px}
  #card .en{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
  #card .spec{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
    font-size:11.5px;line-height:1.75;color:#b6bcc7}
  #card .spec span{color:var(--dim2)}
  #card .note{margin-top:11px;font-size:11.5px;line-height:1.72;color:#8e95a2;font-style:normal}
  #card .x{position:absolute;right:14px;top:14px;width:20px;height:20px;border-radius:6px;
    display:grid;place-items:center;color:var(--dim2);cursor:pointer;font-size:14px;line-height:1}
  #card .x:hover{background:rgba(255,255,255,.08);color:#fff}

  /* ---------- 仪表盘 ---------- */
  #dash{position:fixed;right:20px;bottom:26px;width:186px;padding:13px 15px;z-index:5}
  #dash .h{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.18em;color:var(--dim);
    margin-bottom:10px;font-family:ui-monospace,monospace}
  #dash .row{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;color:var(--dim);padding:3.5px 0}
  #dash .row b{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--txt);font-weight:400}
  #lamp{width:6px;height:6px;border-radius:50%;background:#2a3242;display:inline-block;
    margin-right:6px;transition:.08s;box-shadow:0 0 0 0 rgba(58,95,206,0)}

  /* ---------- 系统图例 ---------- */
  #sysbar{position:fixed;left:26px;top:96px;width:196px;padding:13px 14px;z-index:6;
    opacity:0;pointer-events:none;transform:translateX(-10px);transition:.26s}
  #sysbar.show{opacity:1;pointer-events:auto;transform:none}
  #sysbar .t{font-size:9.5px;letter-spacing:.2em;color:var(--dim);margin-bottom:10px}
  #sysbar .it{display:flex;align-items:center;gap:9px;font-size:11px;color:#a8aeba;
    padding:4px 0;cursor:pointer;transition:.14s}
  #sysbar .it:hover{color:#fff}
  #sysbar .it.off{opacity:.32}
  #sysbar .dot{width:8px;height:8px;border-radius:50%;flex:none}

  /* ---------- 分步条 ---------- */
  #stepbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    display:flex;align-items:center;gap:0;padding:9px 12px;z-index:6;
    opacity:0;pointer-events:none;transition:.26s}
  #stepbar.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  #stepbar .st{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;
    font-size:10.5px;color:var(--dim2);cursor:pointer;transition:.15s;white-space:nowrap}
  #stepbar .st:hover{color:#fff;background:rgba(255,255,255,.05)}
  #stepbar .st.on{color:#fff;background:rgba(58,95,206,.22)}
  #stepbar .st b{font-family:ui-monospace,monospace;font-size:9px;opacity:.6}
  #stepbar .dash{width:10px;height:1px;background:rgba(255,255,255,.14);flex:none}
  #stepbar .nav{display:flex;gap:4px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line)}
  #stepbar .nav .btn{padding:5px 9px}

  /* ---------- 聚焦返回 ---------- */
  #focusBack{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-8px);
    padding:8px 16px;font-size:11px;letter-spacing:.1em;border-radius:9px;cursor:pointer;z-index:7;
    opacity:0;pointer-events:none;transition:.24s;display:flex;align-items:center;gap:8px}
  #focusBack.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  #focusBack:hover{border-color:rgba(255,255,255,.24)}

  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    padding:9px 16px;font-size:11.5px;border-radius:10px;z-index:9;opacity:0;
    pointer-events:none;transition:.3s;letter-spacing:.04em}
  #toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- 首屏 ---------- */
  #boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;
    transition:opacity .7s ease}
  #boot.out{opacity:0;pointer-events:none}
  #boot .in{text-align:center}
  #boot .k{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.42em;color:#9aa1ae}
  #boot .line{width:180px;height:1px;background:rgba(255,255,255,.1);margin:16px auto 0;overflow:hidden}
  #boot .line i{display:block;height:100%;width:0%;background:var(--accent2);transition:width .3s}

  /* ---------- 动力弧 / 导览 / 增量控制 ---------- */
  #dash .powerArc{display:block;width:100%;height:104px;margin:-2px 0 5px;overflow:visible}
  #dash .powerArc .track{fill:none;stroke:rgba(255,255,255,.10);stroke-width:5;stroke-linecap:round}
  #dash .powerArc .fill{fill:none;stroke:var(--accent2);stroke-width:5;stroke-linecap:round;
    stroke-dasharray:100;stroke-dashoffset:38;transition:stroke-dashoffset .16s linear;
    filter:drop-shadow(0 0 4px rgba(108,140,255,.55))}
  #dash .powerArc text{font-family:ui-monospace,monospace;text-anchor:middle;fill:var(--txt)}
  #dash .powerArc .scale{font-size:8px;fill:var(--dim2)}
  #dash .powerArc .unit{font-size:8px;fill:var(--dim);letter-spacing:.12em}
  #dash .powerArc #dPow{font-size:18px}
  #dash .row.esc b{font-size:11px}
  #left .hint{margin-top:9px;text-align:center;font-size:9px;color:var(--dim2);letter-spacing:.05em}
  #tourbar{position:fixed;left:26px;bottom:142px;width:276px;padding:15px 16px;z-index:7;
    opacity:0;transform:translateX(-12px);pointer-events:none;transition:.25s}
  #tourbar.show{opacity:1;transform:none;pointer-events:auto}
  #tourbar .meta{display:flex;justify-content:space-between;font:9px ui-monospace,monospace;
    letter-spacing:.16em;color:var(--accent2)}
  #tourbar h3{font-size:17px;font-weight:550;margin:9px 0 6px}
  #tourbar p{font-size:11px;line-height:1.65;color:#9aa2b0;min-height:36px}
  #tourbar .ops{display:flex;align-items:center;gap:6px;margin-top:12px}
  #tourbar .ops .btn{flex:1;padding:6px 8px}
  #tourbar .ops .exit{flex:0 0 34px}
  body.exporting #toast{opacity:0}

  .hidden{display:none !important}

  @media (max-width:900px){
    #brand{left:14px;top:12px}
    #brand .k{font-size:10.5px;letter-spacing:.26em}
    #brand .s{display:none}
    #tools{right:8px;left:8px;top:36px;max-width:none;gap:3px;justify-content:flex-end}
    .btn{font-size:9.5px;padding:5px 7px;border-radius:7px}
    .btn .n{display:none}
    #left{left:8px;right:8px;width:auto;bottom:8px;padding:10px 12px 9px}
    #dash{right:8px;bottom:94px;width:136px;padding:8px 10px}
    #dash .h{font-size:8.5px;margin-bottom:6px}
    #dash .row{font-size:9.5px;padding:2px 0}
    #dash .row b{font-size:11px}
    #card{right:8px;left:8px;top:auto;bottom:94px;width:auto;padding:14px 16px}
    #card h2{font-size:16px}
    #sysbar{left:8px;top:74px;width:150px;padding:10px 12px}
    #stepbar{left:8px;right:8px;transform:none;bottom:94px;justify-content:flex-start;
      overflow-x:auto;scrollbar-width:none}
    #stepbar.show{transform:none}
    #stepbar::-webkit-scrollbar{display:none}
    #focusBack{top:auto;bottom:94px}
    #toast{bottom:150px;font-size:10.5px;max-width:calc(100vw - 24px);text-align:center}
  }
  @media (max-width:620px){
    #dash{display:block;left:8px;right:auto;bottom:94px;width:132px;padding:7px 9px}
    #dash .powerArc{height:75px}
    #dash .powerArc #dPow{font-size:15px}
    #dash .h,#dash .row{letter-spacing:.04em}
    #stepbar{bottom:92px}
  }
  @media (max-width:900px){
    #tools{left:8px;right:8px;top:34px;justify-content:center;max-width:none;max-height:64px;overflow-y:auto}
    #tools .btn{padding:5px 6px}
    #tourbar{left:8px;right:8px;bottom:184px;width:auto;padding:11px 13px}
    #tourbar p{min-height:0}
    #card{max-height:43vh;overflow-y:auto}
    #left .hint{display:none}
  }
  @media (max-width:620px){
    #brand .k{font-size:9px}
    #tools{top:28px;gap:3px;max-height:57px}
    #tools .btn{font-size:8.5px;padding:4px 5px}
    #dash .h{font-size:7px}
    #dash .row{font-size:8px}
    #dash .row b{font-size:9px}
    #tourbar{bottom:178px}
  }
  @media (prefers-reduced-motion:reduce){
    #boot,.btn,#card,#stepbar,#tourbar,#toast{transition-duration:.01s !important}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="boot"><div class="in"><div class="k">CALIBRE T-65</div><div class="line"><i></i></div></div></div>

<header id="brand">
  <div class="k">CALIBRE T-65</div>
  <div class="s"><i></i>手动上链陀飞轮 · 30.0 mm · 3 Hz · 65 h</div>
</header>

<div id="tools">
  <button class="btn" id="bRun">启动<span class="n">R</span></button>
  <button class="btn" id="bExplode">拆解演示<span class="n">E</span></button>
  <button class="btn" id="bStep">分步<span class="n">S</span></button>
  <button class="btn" id="bXray">透视<span class="n">X</span></button>
  <button class="btn" id="bColor">系统着色<span class="n">C</span></button>
  <button class="btn" id="bWind" title="按住上弦，也可按住 W 或拖动表冠">上弦<span class="n">W</span></button>
  <button class="btn" id="bSlow" title="循环 1× / 1/50× / 1/200×">1×</button>
  <button class="btn" id="bCage" title="慢放时框架仍保持每分钟一圈">框架跟随</button>
  <button class="btn" id="bTour">导览<span class="n">T</span></button>
  <button class="btn" id="bSound">声音<span class="n">M</span></button>
  <button class="btn" id="bShot" title="点击 2K；Shift+点击或 Shift+P 导出 4K">截图<span class="n">P</span></button>
  <button class="btn" id="bShare">分享</button>
</div>

<aside id="left" class="panel">
  <div class="lbl"><span>爆炸拆解</span><b id="eVal">0%</b></div>
  <input id="eSlider" type="range" min="0" max="100" value="0" step="0.5" />
  <div class="row">
    <button class="btn" id="qHigh">高</button>
    <button class="btn" id="qMid">中</button>
    <button class="btn" id="qLow">低</button>
  </div>
  <div class="hint">按住 W / 拖动表冠上弦 · [ ] 拆解</div>
</aside>

<aside id="card" class="panel">
  <div class="x" id="cardX">×</div>
  <div class="sys" id="cSys">SYSTEM</div>
  <h2 id="cName">—</h2>
  <div class="en" id="cEn">—</div>
  <div class="spec" id="cSpec"></div>
  <div class="note" id="cNote"></div>
</aside>

<aside id="dash" class="panel">
  <div class="h"><span>TIMING</span><span id="dQ">HIGH</span></div>
  <svg class="powerArc" viewBox="0 0 172 104" role="img" aria-label="动力储存 0 到 65 小时">
    <path class="track" d="M24 82 A62 62 0 0 1 148 82" pathLength="100" />
    <path class="fill" id="powerArc" d="M24 82 A62 62 0 0 1 148 82" pathLength="100" />
    <text class="scale" x="20" y="96">0</text><text class="scale" x="151" y="96">65</text>
    <text id="dPow" x="86" y="59">—</text><text class="unit" x="86" y="75">POWER RESERVE</text>
  </svg>
  <div class="row"><span>摆幅</span><b id="dAmp">—</b></div>
  <div class="row"><span>摆频</span><b>3 Hz</b></div>
  <div class="row"><span>走时</span><b id="dTime">—</b></div>
  <div class="row esc"><span><i id="lamp"></i>擒纵</span><b id="dEsc">—</b></div>
</aside>

<aside id="sysbar" class="panel">
  <div class="t">八大系统</div>
  <div id="sysList"></div>
</aside>

<div id="stepbar" class="panel">
  <div class="nav">
    <button class="btn" id="sPrev">‹ 上一步</button>
    <button class="btn" id="sNext">下一步 ›</button>
  </div>
</div>

<aside id="tourbar" class="panel" aria-live="polite">
  <div class="meta"><span>GUIDED TOUR</span><span id="tourCount">01 / 07</span></div>
  <h3 id="tourTitle">整机概览</h3><p id="tourText"></p>
  <div class="ops">
    <button class="btn" id="tourPrev">← 上一站</button>
    <button class="btn" id="tourNext">下一站 →</button>
    <button class="btn exit" id="tourExit" title="Esc 退出">×</button>
  </div>
</aside>

<div id="focusBack" class="panel">‹ 返回整机 <span style="opacity:.4;font-family:ui-monospace,monospace;font-size:9px">ESC</span></div>
<div id="toast" class="panel"></div>
